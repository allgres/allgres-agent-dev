async function projectChatMode(target){
  target=target||$('#view');
  const pd=await rpc('projects.list').catch(()=>({projects:[]}));
  const opts_=(pd.projects||[]).filter(p=>p.is_active&&p.agent_id);
  if((!state.chatProjectId||!opts_.some(p=>p.project_id===state.chatProjectId))&&opts_.length)
    state.chatProjectId=opts_[0].project_id;
  const opts=opts_.map(p=>`<option value="${esc(p.project_id)}" ${p.project_id===state.chatProjectId?'selected':''}>${esc(p.name)} (${esc(p.agent)})</option>`).join('');
  // require_project_access's own comment: a project is only reachable once
  // its bound agent is assigned to this user the same way General mode's
  // agent would be, so that agent is always present in agents.mine too --
  // no separate lookup needed for the provider/model picker below.
  const md=await rpc('agents.mine').catch(()=>({agents:[]})); state.myAgents=md.agents||[];
  const curProject=opts_.find(p=>p.project_id===state.chatProjectId);
  const projectAgent=curProject?state.myAgents.find(a=>a.agent_id===curProject.agent_id):null;
  const ds=await rpc('providers.available').catch(()=>({providers:[]}));
  const providerOpts=ds.providers||[];
  target.innerHTML=`<div class="panel"><div class="row u-margin-bottom-22px"><label class="muted u-font-size-12px">Project</label><select class="select u-max-width-300px" id="chatProjectSel">${opts||'<option value="">No project configured for chat yet</option>'}</select></div>${chatModelPicker(projectAgent,providerOpts)}<div class="u-max-height-55vh-overflow-auto-margin-bottom-14px" id="projectChatThread"></div><div class="row"><input class="input" id="projectChatInput" placeholder="Message…" ${opts_.length?'':'disabled'}><button class="btn primary" id="projectChatSend" ${opts_.length?'':'disabled'}>${esc(t('send'))}</button></div></div>`;
  $('#chatProjectSel').onchange=()=>{state.chatProjectId=$('#chatProjectSel').value;projectChatMode(target)};
  wireChatModelPicker(projectAgent,providerOpts,()=>projectChatMode(target));
  $('#projectChatSend').onclick=sendProjectChat;
  $('#projectChatInput').onkeydown=e=>{if(e.key==='Enter')sendProjectChat()};
  await renderProjectChatThread();
}
async function renderProjectChatThread(){
  if(!$('#projectChatThread'))return;
  if(!state.chatProjectId){$('#projectChatThread').innerHTML=`<div class="muted">${esc(t('noData'))}</div>`;return}
  try{ const h=await rpc('project_chat.history',{project_id:state.chatProjectId});
    if(!$('#projectChatThread'))return;
    $('#projectChatThread').innerHTML=(h.messages||[]).map(m=>msgBubble(m)).join('')||'<div class="muted">Say hello.</div>';
    scrollBottom('#projectChatThread');
  }catch(e){if($('#projectChatThread'))$('#projectChatThread').innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}
let projectChatPollTimer=null;
async function sendProjectChat(){
  if(!state.chatProjectId)return;
  const v=$('#projectChatInput').value.trim(); if(!v)return;
  $('#projectChatInput').value='';
  try{
    await rpc('project_chat.send',{project_id:state.chatProjectId,message:v});
    await renderProjectChatThread();
    if(projectChatPollTimer)clearInterval(projectChatPollTimer);
    projectChatPollTimer=setInterval(renderProjectChatThread,3000);
  }catch(e){toast(e.message)}
}
// --- Messenger: the Slack-style shared channel. A plain post is just
// stored; "@agent_name" additionally routes the message to that agent
// (fn_messenger_post), sharing the same session chat.send/chat.history use
// for that (user, agent) pair -- not a second, divergent conversation. ---
async function messengerPage(target){
  target=target||$('#view');
  target.innerHTML=`<div class="panel"><div class="muted u-font-size-12px-margin-bottom-10px">Talk normally, or use <code>@agent-name</code> to assign work to one or more Agents. Runs and replies stay in the same conversation.</div><div class="u-max-height-60vh-overflow-auto-margin-bottom-14px" id="msgFeed"></div><div class="row"><input class="input" id="msgInput" placeholder="Message… use @agent-name to call an Agent"><button class="btn primary" id="msgSend">${esc(t('send'))}</button></div></div>`;
  $('#msgSend').onclick=sendMessenger;
  $('#msgInput').onkeydown=e=>{if(e.key==='Enter')sendMessenger()};
  await renderMessengerFeed();
}
async function renderMessengerFeed(){
  const d=await rpc('messenger.list',{limit:200});
  // Same stray-poll-tick guard as renderChatThread: a call already in
  // flight can still land after navigating away from Messenger.
  if(!$('#msgFeed'))return;
  const oneReply=(agent,st,reply)=>{
    const body=st==='completed'?esc(reply||''):st==='failed'?'(agent failed to respond)':'(waiting for reply…)';
    return `<div class="msg-body mono u-color-var-accent2">${agent?`<b>${esc(agent)}:</b> `:''}${body}</div>`;
  };
  // A multi-mention post (item 40) shows every mentioned agent's own reply,
  // not just the first -- mentioned_agents is only present for those.
  const replyLine=m=>{
    if(Array.isArray(m.mentioned_agents)&&m.mentioned_agents.length)
      return m.mentioned_agents.map(x=>oneReply(x.agent,x.reply_status,x.reply)).join('');
    if(!m.mentioned_agent)return '';
    return oneReply(null,m.reply_status,m.reply);
  };
  $('#msgFeed').innerHTML=(d.messages||[]).map(m=>`<div class="msg"><div class="row"><b>${esc(m.author)}</b>${m.mentioned_agent?`<span class="mono muted u-font-size-11px">@${esc(m.mentioned_agent)}</span>`:''}<span class="spacer"></span><span class="mono muted u-font-size-11px">${esc(m.created_at)}</span></div><div class="msg-body">${esc(m.content)}</div>${replyLine(m)}</div>`).join('')||'<div class="muted">No messages yet.</div>';
  scrollBottom('#msgFeed');
}
let msgPollTimer=null;
async function sendMessenger(){
  const v=$('#msgInput').value.trim(); if(!v)return;
  $('#msgInput').value='';
  try{
    await rpc('messenger.post',{text:v});
    await renderMessengerFeed();
    if(msgPollTimer)clearInterval(msgPollTimer);
    msgPollTimer=setInterval(renderMessengerFeed,3000);
  }catch(e){toast(e.message)}
}

// --- My Agents (regular users): the assigned-agents list plus, inline, the
// one thing item 3's review asked for a regular user to be able to do --
// pick a provider/model for an agent they were given -- via
// fn_set_my_model, never the full agents.update surface. ---
async function myAgentsPage(){
  const d=await rpc('agents.mine'); state.myAgents=d.agents||[];
  const ds=await rpc('providers.available').catch(()=>({providers:[]}));
  const providerOpts=ds.providers||[];
  $('#view').innerHTML=`<div class="panel"><h3>My agents</h3><div class="muted u-font-size-12px-margin-bottom-10px">Your Provider and Model choices apply only to your conversations. They never change the shared Agent default.</div>${state.myAgents.length?state.myAgents.map(a=>`<div class="listrow"><div class="row"><b>${esc(a.name)}</b><span class="spacer"></span><span class="muted">Default: ${esc(a.default_provider||'—')} / ${esc(a.default_model||'—')}</span></div><div class="grid2 u-margin-top-8px"><div class="field"><label>My provider</label><select class="select myProv" data-agent="${esc(a.agent_id)}">${providerOpts.length?(!a.provider?'<option value="">— select —</option>':'')+providerOpts.map(p=>`<option value="${esc(p.name)}" ${p.name===a.provider?'selected':''}>${esc(p.name)} (${esc(p.kind)})</option>`).join(''):'<option value="">No provider configured -- ask an admin</option>'}</select></div><div class="field"><label>My model</label><input class="input myModel" data-agent="${esc(a.agent_id)}" value="${esc(a.model||'')}" placeholder="e.g. gpt-4o, claude-sonnet-5"></div></div><div class="row"><button class="btn small saveMyModel" data-agent="${esc(a.agent_id)}">Save for me</button>${a.is_overridden?`<button class="btn small resetMyModel" data-agent="${esc(a.agent_id)}">Use Agent default</button>`:''}</div></div>`).join(''):'<div class="muted">No agents assigned yet -- ask an admin.</div>'}</div>`;
  document.querySelectorAll('.saveMyModel').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.agent;
    const provider=document.querySelector(`.myProv[data-agent="${id}"]`).value;
    const model=document.querySelector(`.myModel[data-agent="${id}"]`).value;
    try{await rpc('agents.set_my_model',{agent_id:id,provider,model});toast('Saved');myAgentsPage()}catch(e){toast(e.message)}
  });
  document.querySelectorAll('.resetMyModel').forEach(b=>b.onclick=async()=>{try{await rpc('agents.set_my_model',{agent_id:b.dataset.agent,provider:'',model:''});toast('Using Agent default');myAgentsPage()}catch(e){toast(e.message)}});
}
// The event stream authenticates with a short-lived, single-use ticket
// (POST /api/v1/events/ticket, gated by the real bearer token) instead of
// carrying the durable dashboard token in the URL -- EventSource cannot set
// headers, so something has to go in the query string, and this keeps it
// out of proxy access logs, browser history, and the Referrer header. The
// server closes the stream every ~30s on purpose (see stream_events in
// src/lib.rs) and does not send a `retry:` field, so reconnection is driven
// from here: mint a fresh ticket and open a new EventSource on every error,
// rather than relying on the browser's native retry-with-the-same-URL,
// which a single-use ticket cannot satisfy.
let esRetryTimer=null;
async function startEvents(){
  if(esRetryTimer){clearTimeout(esRetryTimer);esRetryTimer=null}
  let url='/api/v1/events';
  try{
    const t=await api('/api/v1/events/ticket',{method:'POST'});
    if(t.ticket)url+='?ticket='+encodeURIComponent(t.ticket)
  }catch(e){
    $('#health').textContent='reconnecting';
    esRetryTimer=setTimeout(startEvents,2000);
    return;
  }
  const es=new EventSource(url);
  es.addEventListener('snapshot',e=>{try{const d=JSON.parse(e.data);$('#health').textContent='workers online';const live=$('#live');if(live&&d.tasks){live.innerHTML=d.tasks.slice(0,8).map(t=>`<div class="row u-padding-5px-0"><span>${esc(t.agent)}</span><span>${status(t.status)}</span><span class="mono muted">step ${esc(t.step_count)}</span></div>`).join('')||'No activity'} }catch{}});
  es.onerror=()=>{$('#health').textContent='reconnecting';es.close();esRetryTimer=setTimeout(startEvents,1500)};
}
// If the page just loaded from a provider's OAuth redirect (?code=&state=),
// complete the flow before anything else renders. The redirect_uri
// registered with the provider is this dashboard's own URL, so this is the
// only place a code/state pair can arrive -- there is no separate callback
// route. providers.oauth_callback only ever queues the exchange (see
// KNOWN_ISSUES.md, "a second-round external review of items 18 and 19"), so
// nothing secret ever reaches this page: the runtime worker performs the
// real token exchange in the background and settings.get's has_secret is
// how a later Settings load finds out it landed.
async function oauthCallbackOnLoad(){
  const qs=new URLSearchParams(location.search);
  const oauthCode=qs.get('code'), oauthState=qs.get('state');
  if(!oauthCode||!oauthState)return;
  history.replaceState({}, '', location.pathname);
  try{
    await rpc('providers.oauth_callback',{code:oauthCode,state:oauthState,redirect:location.origin+location.pathname});
    toast('OAuth exchange queued -- check back in a moment for the connected status.');
  }catch(e){toast('OAuth callback failed: '+e.message)}
  state.page='Settings';
  saveUi('page','Settings');
}
// A real per-user login gate in front of the whole app -- separate from,
// and on top of, the dashboard token above: that token still decides
// whether a browser reaches the HTTP surface at all; this decides, once it
// has, who is using it and which pages/agents they may reach (see README,
// "Model configuration and conversations").
function renderLogin(err){
  $('.app').classList.add('hidden');
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog u-max-width-360px"><div class="brand">Allgres</div><div class="tag u-margin-bottom-20px">Postgres Is All You Need.</div><h3>${esc(t('signIn'))}</h3><div class="field"><label>${esc(t('username'))}</label><input class="input" id="liUser"></div><div class="field"><label>${esc(t('password'))}</label><input type="password" class="input" id="liPass"></div><button class="btn primary" id="liGo">${esc(t('signIn'))}</button>${err?`<div class="muted u-font-size-12px-margin-top-10px-color-var-bad">${esc(err)}</div>`:''}</div>`;
  const go=async()=>{
    try{
      const r=await rpc('auth.login',{username:$('#liUser').value,password:$('#liPass').value});
      setSessTok(r.session_token);
      state.me={user_id:r.user_id,username:r.username,role:r.role};
      state.page=pagesForRole()[0];
      saveUi('page',state.page);
      $('#modal').classList.add('hidden');$('#modal').innerHTML='';
      $('.app').classList.remove('hidden');
      await boot(true);
    }catch(e){renderLogin(e.message)}
  };
  $('#liGo').onclick=go;
  $('#liPass').onkeydown=e=>{if(e.key==='Enter')go()};
}
$('#logoutBtn').onclick=async()=>{
  try{await rpc('auth.logout')}catch{}
  setSessTok('');state.me=null;
  location.reload();
};
async function boot(skipOauth){
  let me;
  try{ me=await rpc('auth.me') }catch(e){ me={logged_in:false} }
  if(!me.logged_in){ setSessTok(''); state.me=null; renderLogin(); return }
  state.me={user_id:me.user_id,username:me.username,role:me.role};
  if(!skipOauth) await oauthCallbackOnLoad();
  if(!pagesForRole().includes(state.page))state.page=pagesForRole()[0];
  saveUi('page',state.page);
  nav();loadPage();startEvents();
}
document.documentElement.lang=uiLang();
loadPack(uiLang()).then(()=>{startI18n();applyI18n()}).finally(()=>boot());
</script></body></html>

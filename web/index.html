async function api(path,opt={}){

// A provider's is_enabled flag only ever meant "an operator turned this on",
// never "this endpoint actually answers with the stored credential right
// now" -- last_probe_status (set by fn_complete_provider_probe, from
// Settings' own "Test connection" button) is the real signal. 'untested'
// covers both a provider nobody has probed yet and a fresh install's seeded
// rows, which start with last_probe_status NULL either way.
// A test of a provider (or of a person's model) is queued, polled, and shown
// as what came back: the server's own words and what to try next. A 2xx with
// the wrong body is not a pass (the server side checks the shape).
async function awaitProbe(action,callId,extra={}){

async function runProviderChecks({start,out,model,onModels,baseInput}){

    $('#probeFixV1').onclick=()=>{baseInput.value=baseInput.value.replace(/\/+$/,'')+'/v1';rerun()};
  };
  try{
    const a=await start('models','');
    const s1=await awaitProbe('providers.probe_status',a.call_id);
    if(!s1.passed){out.innerHTML=probeFailHtml(s1,'model list');fixButton(s1);return false}
    if(onModels)onModels(s1.models||s1.available_models||[]);
    const line=`<div>${status('ok')} Reached the server; it lists ${esc(s1.model_count)} model(s).</div>`;

// agent in this system must reply in (see fn_next_step's own prompt), not
// something a chat UI should show verbatim. Only that one shape unwraps to
// plain text; anything else (execute_sql, an error, mid-turn actions still
// worth seeing) falls back to the same raw rendering fmtContent already
// gives everywhere else (Logs' full transcript included -- deliberately
// untouched, since that view exists to show exactly this).
function chatText(l){

// KNOWN_ISSUES.md item 5: `allgres web` deliberately never connects to the
// database (see runtime_worker.rs's own module doc), so it can never appear
// in pg_stat_activity -- d.workers (built from that view, sql/grants_and_
// facade.sql) can therefore only ever list `allgres runtime`, which used to
// read as though the web worker were down while it was the one serving this
// very page. Fixed client-side, not by teaching SQL to see a connection that
// genuinely does not exist: this successful fetch is itself live proof
// `allgres web` is up right now, so synthesize its row from that instead of
// from a query that structurally cannot see it.
function workersWithWeb(reported){
  const workers=[...(reported||[])];
  if(!workers.some(w=>w.name==='allgres web'))workers.push({name:'allgres web',self:true});
  return workers;
}

// whether this agent's own recent completed/failed ratio is better, worse,
// or the same as it was right before its last policy change. No action
// here rolls anything back automatically; this is purely something for an
// operator (or a future self_improve turn) to read and decide from.

  $('#modal').classList.remove('hidden');
  const colorClass={improved:'txt-accent',regressed:'txt-bad'}[r.verdict]||'muted';
  $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>Evaluate last change</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div>
<div class="field"><span class="verdict-label ${colorClass}">${esc(r.verdict)}</span></div>
<div class="muted u-font-size-12px-line-height-1-6">
current success rate: ${r.current_success_rate??'no evaluable data yet'} (${r.current_sample_size??0} sample${r.current_sample_size===1?'':'s'})<br>
success rate before that change: ${r.success_rate_before_last_change??'no evaluable data yet'} (${r.before_sample_size??0} sample${r.before_sample_size===1?'':'s'})<br>
compared to generation: ${r.compared_to_generation??'—'}<br>

completion rate only -- not a judge of whether the agent's actual output was correct
</div></div>`;

}

// Who a routed request waits on, and who may act on it. A request no rule
// routed shows nothing extra. can_decide is the server's own answer.
function routeNote(x){
  if(!x.routed_role)return '';

  return `<div class="muted u-font-size-12px">Routed to <b>${esc(x.routed_role)}</b>${esc_}</div>`;
}

  const proposals=cur?.proposals||[];
  const proposalPanel=proposals.length?`<div class="panel"><h3>Waiting for you</h3><div class="muted u-margin-bottom-10px">The lead proposed these. Nothing starts until you confirm. Confirming or declining is kept as your decision.</div>${proposals.map(p=>`<div class="listrow"><div class="row"><b>${esc(p.assignee)}</b><span class="muted"> — ${esc(p.goal)}</span><span class="spacer"></span><button class="btn primary small rmConfirm" data-id="${esc(p.proposal_id)}">Confirm</button><button class="btn danger small rmDecline" data-id="${esc(p.proposal_id)}">Decline</button></div></div>`).join('')}</div>`:'';
  const thread=room?`${proposalPanel}<div class="panel"><div class="row wrap"><h3 class="u-margin-bottom-0">${esc(room.name)}</h3>${room.mode==='assisted'?'<span class="status s-checking">assisted</span>':''}${room.mode==='auto'?'<span class="status s-ok">auto</span>':''}${room.status==='closed'?'<span class="status s-stale">closed</span>':''}${room.busy?'<span class="status s-checking">an agent is working…</span>':''}<span class="spacer"></span><span class="muted">${esc(room.turns)} of ${esc(room.max_turns)} agent turns · $${esc(Number(room.cost_usd).toFixed(4))} of $${esc(room.max_cost_usd)}</span></div>${room.purpose?`<div class="muted">${esc(room.purpose)}</div>`:''}

  $('#view').innerHTML=`<div class="muted u-margin-bottom-10px">A room is where people and agents work on something together. Call an agent with @name; its answer comes back here. Nothing runs unless a person calls it.</div><div class="rooms-grid">${side}<div>${thread}</div></div>`;
  if(draft&&$('#rmText'))$('#rmText').value=draft;

// --- One model for many agents, and a default for new agents. The model is
// written into each chosen agent's own settings (never a hidden fallback), what
// each had before is kept in the audit log, and system agents are left out.
async function modelsApplyPanel(){
  const box=$('#maBody');if(!box)return;
  let tg,av;
  try{[tg,av]=await Promise.all([rpc('models.targets'),rpc('providers.available').catch(()=>({providers:[]}))])}catch(e){box.textContent=e.message;return}
  const provs=(av.providers||[]).filter(p=>p.purpose!=='embedding');
  const agents=tg.agents||[],fns=tg.functions||[],procs=tg.procedures||[],def=tg.default;
  const cur=a=>a.model?`${a.provider||'?'} / ${a.model}`:'no model';
  const ovr=x=>x.override?.model?`${x.override.provider||'?'} / ${x.override.model}`:'agent\'s own model';
  box.className='';
  box.innerHTML=`<div class="muted u-margin-bottom-10px">Pick a model once and put it on many agents, or on chosen functions and procedures. Only the provider and model change; each agent's instructions, limits and everything else stay. What each one had before is kept in the audit log. System agents are never changed.</div>
${def?`<div class="banner u-margin-bottom-10px">New agents start with <b>${esc(def.provider)} / ${esc(def.model)}</b>. <button class="btn small" id="maClearDefault">Stop doing that</button></div>`:'<div class="muted u-margin-bottom-10px">No default for new agents: a new agent has no model until you give it one.</div>'}
<div class="row wrap u-gap-8px"><select class="select u-max-width-220px" id="maProvider">${provs.map(p=>opt(p.name,p.name,def&&p.name===def.provider)).join('')}</select><input class="input u-max-width-220px" id="maModel" list="maModels" placeholder="model name" value="${esc(def?.model||'')}"><datalist id="maModels"></datalist></div>
<div class="u-margin-top-12px"><label class="muted"><input type="radio" name="maScope" value="all" checked> All ${agents.length} agents</label> &nbsp; <label class="muted"><input type="radio" name="maScope" value="pick"> Only the ones I tick</label></div>
<div id="maPick" class="hidden u-margin-top-12px">${agents.map(a=>`<label class="row"><input type="checkbox" class="maAgent" value="${esc(a.agent_id)}"> <b>${esc(a.name)}</b><span class="muted">${esc(cur(a))}${a.is_active?'':' · inactive'}</span></label>`).join('')||'<div class="muted">No agents yet.</div>'}</div>
<details class="u-margin-top-12px"><summary>Functions and procedures (${fns.length+procs.length})</summary><div class="muted u-margin-top-12px">A function or procedure can use its own model when an agent reasons about its result. Tick the ones to change; the rest keep what they have.</div>
${fns.map(f=>`<label class="row"><input type="checkbox" class="maFn" value="${esc(f.function_id)}"> ${esc(f.name)} <span class="muted">function · ${esc(ovr(f))}</span></label>`).join('')}${procs.map(f=>`<label class="row"><input type="checkbox" class="maProc" value="${esc(f.procedure_id)}"> ${esc(f.name)} <span class="muted">procedure · ${esc(ovr(f))}</span></label>`).join('')}
<div class="u-margin-top-12px"><button class="btn small" id="maClearOv">Give the ticked ones back their agent's model</button></div></details>
<div class="u-margin-top-12px"><label class="muted"><input type="checkbox" id="maDefault"> Also make it the model new agents start with</label></div>
<div class="row wrap u-gap-8px u-margin-top-12px"><button class="btn primary" id="maApply">Apply</button><span class="muted" id="maSummary"></span></div>`;
  const prov=()=>provs.find(p=>p.name===$('#maProvider').value);
  const fillModels=()=>{$('#maModels').innerHTML=(prov()?.available_models||[]).map(m=>`<option value="${esc(m)}">`).join('')};
  fillModels();$('#maProvider').onchange=fillModels;
  const picked=()=>({agents:[...document.querySelectorAll('.maAgent:checked')].map(x=>x.value),fns:[...document.querySelectorAll('.maFn:checked')].map(x=>x.value),procs:[...document.querySelectorAll('.maProc:checked')].map(x=>x.value)});
  const summary=()=>{const all=document.querySelector('input[name=maScope]:checked').value==='all';$('#maPick').classList.toggle('hidden',all);const p=picked();const n=all?agents.length:p.agents.length;const bits=[`${n} agent${n===1?'':'s'}`];if(p.fns.length)bits.push(`${p.fns.length} function${p.fns.length===1?'':'s'}`);if(p.procs.length)bits.push(`${p.procs.length} procedure${p.procs.length===1?'':'s'}`);$('#maSummary').textContent='Will change '+bits.join(', ')+'.'};
  box.querySelectorAll('input').forEach(i=>i.onchange=summary);summary();
  $('#maApply').onclick=async()=>{
    const all=document.querySelector('input[name=maScope]:checked').value==='all',p=picked(),model=$('#maModel').value.trim();
    if(!$('#maProvider').value||!model)return toast('Pick a provider and give the model name');
    const n=all?agents.length:p.agents.length;
    if(!n&&!p.fns.length&&!p.procs.length&&!$('#maDefault').checked)return toast('Nothing is ticked');
    if(!confirm(`Put ${$('#maProvider').value} / ${model} on ${n} agent${n===1?'':'s'}${p.fns.length+p.procs.length?` and ${p.fns.length+p.procs.length} function(s)/procedure(s)`:''}? What they had is kept in the audit log.`))return;
    try{const r=await rpc('models.apply',{provider:$('#maProvider').value,model,all_agents:all,agent_ids:all?[]:p.agents,function_ids:p.fns,procedure_ids:p.procs,set_default:$('#maDefault').checked});
      toast(`Changed ${r.agents} agent${r.agents===1?'':'s'}${r.functions+r.procedures?`, ${r.functions+r.procedures} function(s)/procedure(s)`:''}${(r.failed||[]).length?`; ${(r.failed||[]).length} could not be changed`:''}`);
      await settings(SETTINGS_PAGES.Models);await modelsApplyPanel()}catch(e){toast(e.message)}};
  $('#maClearOv').onclick=async()=>{const p=picked();if(!p.fns.length&&!p.procs.length)return toast('Tick a function or procedure first');try{await rpc('models.clear_overrides',{function_ids:p.fns,procedure_ids:p.procs});toast('Done');await settings(SETTINGS_PAGES.Models);await modelsApplyPanel()}catch(e){toast(e.message)}};
  $('#maClearDefault')&&($('#maClearDefault').onclick=async()=>{try{await rpc('models.default_clear');toast('New agents start with no model again');await settings(SETTINGS_PAGES.Models);await modelsApplyPanel()}catch(e){toast(e.message)}});
}
// --- Teams: a second team for an agent, a team's window for work from

// --- Inbound events: outside systems POST a signed request to
// /inbound/<name>. Only a valid signature is accepted; the event is held for
// a person or starts a task, and its body is only ever data. ---
async function inboundPage(){
  const [sr,er,ag]=await Promise.all([rpc('inbound.sources'),rpc('inbound.events'),state.agents.length?Promise.resolve({agents:state.agents}):api('/api/v1/agents')]);
  state.agents=ag.agents||state.agents;
  const sources=sr.sources||[],events=er.events||[];
  const agents=state.agents.filter(a=>!a.is_system&&a.is_active!==false);
  const origin=location.origin;
  const sourceRow=x=>`<tr><td><b>${esc(x.name)}</b><div class="muted mono">POST ${esc(origin+x.path)}</div></td><td>${esc(x.agent)}</td><td>${x.mode==='start'?'Starts a task':'Held for a person'}</td><td>${x.is_enabled?'':'<span class="status s-stale">off</span> '}${x.held?`<span class="status s-pending">${esc(x.held)} waiting</span>`:''}${x.last_event_at?`<div class="muted">last ${esc(new Date(x.last_event_at).toLocaleString())}</div>`:'<div class="muted">no events yet</div>'}</td><td><div class="row"><button class="btn small inMode" data-id="${esc(x.source_id)}" data-mode="${x.mode==='start'?'hold':'start'}">${x.mode==='start'?'Hold for a person':'Start tasks by itself'}</button><button class="btn small inToggle" data-id="${esc(x.source_id)}" data-on="${x.is_enabled?'0':'1'}">${x.is_enabled?'Turn off':'Turn on'}</button><button class="btn small inRotate" data-id="${esc(x.source_id)}">New secret</button><button class="btn danger small inDel" data-id="${esc(x.source_id)}">Delete</button></div></td></tr>`;
  const eventRow=e=>`<tr><td class="mono">${esc(new Date(e.received_at).toLocaleString())}</td><td>${esc(e.source)}</td><td class="mono u-max-width-180px">${esc(String(e.body).slice(0,160))}</td><td>${e.status==='held'?'<span class="status s-pending">waiting</span>':e.status==='started'?'<span class="status s-ok">task started</span>':'<span class="status s-stale">dismissed</span>'}</td><td>${e.status==='held'?`<div class="row"><button class="btn small primary inStart" data-id="${esc(e.event_id)}">Start a task</button><button class="btn small inDismiss" data-id="${esc(e.event_id)}">Dismiss</button></div>`:''}</td></tr>`;
  $('#view').innerHTML=`<div class="muted u-margin-bottom-10px">Let an outside system, such as a sensor, a monitoring tool or a form, hand work to an agent. It sends a POST to the address shown for its source, signed with that source's secret. A request without a valid signature is refused. The event's content is shown to the agent as data inside a marked block and is never treated as an instruction. Reach Allgres from outside only through a reverse proxy you trust.</div>
<div class="panel"><h3>Add a source</h3><div class="grid2"><div class="field"><label>Name (letters, digits, - and _)</label><input class="input" id="inName" placeholder="e.g. pump-alerts"></div><div class="field"><label>Agent that handles it</label><select class="select" id="inAgent">${agents.map(a=>opt(a.agent_id,a.name)).join('')}</select></div></div>
<div class="field"><label>What to ask the agent (put {{event}} where the event goes)</label><input class="input" id="inGoal" value="An alert arrived. Look into it and report what you find. {{event}}"></div>
<div class="row wrap"><select class="select u-max-width-180px" id="inMode"><option value="hold">Hold for a person</option><option value="start">Start a task by itself</option></select><button class="btn primary" id="inAdd">Add source</button></div><div id="inSecret"></div></div>
<div class="panel"><h3>Sources</h3><table class="table"><thead><tr><th>Source</th><th>Agent</th><th>What happens</th><th>Status</th><th></th></tr></thead><tbody>${sources.map(sourceRow).join('')||'<tr><td colspan="5" class="muted">No sources yet. Add one above.</td></tr>'}</tbody></table></div>
<div class="panel"><h3>Recent events</h3><table class="table"><thead><tr><th>Received</th><th>Source</th><th>Content</th><th>Status</th><th></th></tr></thead><tbody>${events.map(eventRow).join('')||'<tr><td colspan="5" class="muted">Nothing has arrived yet.</td></tr>'}</tbody></table></div>`;
  const v=id=>$('#'+id).value;
  const go=async(action,body,msg)=>{try{await rpc(action,body);if(msg)toast(msg);inboundPage()}catch(e){toast(e.message)}};
  const showSecret=(name,secret)=>{$('#inSecret').innerHTML=`<div class="banner u-margin-top-12px">Secret for <b>${esc(name)}</b>. Copy it now; it is not shown again.<div class="mono u-margin-top-12px" id="inSecretText">${esc(secret)}</div><div class="muted">Sign each request: HMAC-SHA256 of <span class="mono">timestamp + "." + body</span> with this secret, sent as <span class="mono">X-Allgres-Timestamp</span> (seconds) and <span class="mono">X-Allgres-Signature: sha256=&lt;hex&gt;</span>. Add <span class="mono">X-Allgres-Event-Id</span> to make retries harmless.</div></div>`};
  $('#inAdd').onclick=async()=>{try{if(!v('inName')||!v('inAgent'))return toast('Give it a name and an agent');const name=v('inName');const r=await rpc('inbound.source_create',{name,agent_id:v('inAgent'),goal_template:v('inGoal'),mode:v('inMode')});await inboundPage();showSecret(name,r.secret)}catch(e){toast(e.message)}};
  document.querySelectorAll('.inMode').forEach(b=>b.onclick=()=>go('inbound.source_set',{source_id:b.dataset.id,mode:b.dataset.mode}));
  document.querySelectorAll('.inToggle').forEach(b=>b.onclick=()=>go('inbound.source_set',{source_id:b.dataset.id,is_enabled:b.dataset.on==='1'}));
  document.querySelectorAll('.inRotate').forEach(b=>b.onclick=async()=>{if(!confirm('Make a new secret? The old one stops working at once.'))return;try{const r=await rpc('inbound.source_rotate',{source_id:b.dataset.id});showSecret('this source',r.secret)}catch(e){toast(e.message)}});
  document.querySelectorAll('.inDel').forEach(b=>b.onclick=()=>{if(confirm('Delete this source and its events?'))go('inbound.source_delete',{source_id:b.dataset.id},'Deleted')});
  document.querySelectorAll('.inStart').forEach(b=>b.onclick=()=>go('inbound.event_start',{event_id:b.dataset.id},'Task started'));
  document.querySelectorAll('.inDismiss').forEach(b=>b.onclick=()=>go('inbound.event_start',{event_id:b.dataset.id,dismiss:true}));
}

<div class="muted mono u-margin-bottom-10px">${esc(m.base_url)}${m.has_key?' · key stored':''}</div>${m.health_detail&&!m.checking?`<div class="banner">${esc(m.health_detail)}</div>`:''}
${m.health==='ok'?`<table class="table"><thead><tr><th>Checkpoint</th><th>Revision</th><th>Device</th></tr></thead><tbody>${loaded.map(n=>`<tr><td><b class="mono">${esc(n)}</b></td><td class="mono">${esc(String((st.revisions||{})[n]||'').slice(0,12))}</td><td>${esc((st.checkpoint_devices||{})[n]||st.device||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No checkpoint is loaded yet. The server loads one when it gets its first request.</td></tr>'}</tbody></table>`:''}</div>`;
  };

<div class="panel"><h3>Connect a server</h3><div class="grid2"><div class="field"><label>Name</label><input class="input" id="dmName" placeholder="e.g. laya-main"></div><div class="field"><label>Address</label><input class="input" id="dmUrl" placeholder="https://laya.example.com"></div>
<div class="field"><label>Key (the server's LAYA_API_KEY, if it has one)</label><input type="password" class="input" id="dmKey" autocomplete="new-password"></div></div>
<label class="muted"><input type="checkbox" id="dmPrivate"> The server is on this machine or a private network</label><div class="row u-margin-top-12px-gap-8px"><button class="btn primary" id="dmGo">Connect and check</button></div></div>
${models.map(card).join('')||'<div class="panel muted">No decision model connected. Everything is decided by people and rules.</div>'}
<div class="panel"><div class="row wrap"><h3 class="u-margin-bottom-0">Hand decisions to the model</h3><span class="spacer"></span>${dpoints.some(p=>p.mode!=='off')?'<button class="btn danger small" id="dgOffAll">Turn everything off</button>':''}</div>
<ol class="muted u-margin-bottom-10px"><li><b>Watch</b>: after a person decides, the model is asked the same question and its answer is only compared.</li><li><b>Check</b>: the page shows how often it agreed. Handing over unlocks after 10 compared decisions at the agreement bar.</li><li><b>Hand over</b>, for a chosen set of agents: a sure answer decides a new decision; doubt, an error or a stopped server leave it with a person.</li></ol><div class="muted u-margin-bottom-10px">A write or physical tool, and approving a proposal, are always a person's. <b>Off</b> goes back at any time.</div>
${dpoints.map(p=>{const o=p.observed||{};const rate=o.compared?Math.round(100*o.agreed/o.compared):null;const agentsOpts=(state.agents||[]).filter(a=>!isFoldedAgent(a)&&a.is_active!==false);

<h3 class="u-margin-top-12px">Recent questions to the model</h3><table class="table"><thead><tr><th>Point</th><th>Kind</th><th>Model said</th><th>Person said</th><th>What happened</th></tr></thead><tbody>${drecent.map(x=>`<tr><td>${esc(x.point_key)}</td><td>${esc(x.mode==='observe'?'watching':'handed over')}</td><td>${esc(x.answer||'—')}${x.confidence!=null?` <span class="muted">(${esc(Number(x.confidence).toFixed(2))})</span>`:''}</td><td>${esc(x.human_answer||'—')}</td><td>${esc(x.outcome||x.status)}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nothing has been asked of the model yet.</td></tr>'}</tbody></table></div>`;

  document.querySelectorAll('.dgSwitch').forEach(b=>b.onclick=()=>go('delegation.checkpoint_switch',{point_key:dgRow(b).dataset.point,report_id:b.dataset.report},'Checkpoint changed'));

// --- MCP servers: paste an address, see the tools, confirm how risky each
// one is, then register it. The server runs outside PostgreSQL; a local
// (stdio) server sits behind an HTTP relay. See docs/mcp-servers.md. ---
let mcpPollTimer=null;
async function mcpPage(){
  if(mcpPollTimer){clearTimeout(mcpPollTimer);mcpPollTimer=null}
  const sv=await rpc('mcp.servers');
  const servers=sv.servers||[];
  const tools=await Promise.all(servers.map(x=>rpc('mcp.tools',{connection_id:x.connection_id}).then(r=>r.tools||[])));
  const healthText={unknown:'not checked yet',ok:'connected',auth_needed:'needs a login or key',unreachable:'cannot be reached',changed:'a tool changed'};
  const riskOpts=sel=>[['','Choose…'],['read','Reads only'],['write','Changes data'],['physical','Moves equipment']].map(([v,l])=>opt(v,l,v===(sel||''))).join('');
  const toolRow=(x,t)=>{
    const confirmed=!!t.risk;
    const ready=confirmed&&t.status!=='removed';
    const act=t.status==='removed'?'<span class="muted">No longer listed</span>'
      :t.status==='registered'?`<span class="muted">Give an agent the ability <b class="mono">${esc(t.procedure_name||t.function_name)}</b></span>`
      :`<button class="btn small primary mcpReg" data-conn="${esc(x.connection_id)}" data-tool="${esc(t.tool_name)}"${ready?'':' disabled'}>${t.status==='changed'?'Approve change':'Register'}</button>`;
    const approval=!confirmed?'<span class="muted">—</span>':t.risk==='read'
      ?`<select class="select u-max-width-140px mcpAppr" data-conn="${esc(x.connection_id)}" data-tool="${esc(t.tool_name)}">${opt('none','Not needed',t.approval==='none')}${opt('required','Ask a person',t.approval==='required')}</select>`
      :'Always asks a person';
    return `<tr><td><b class="mono">${esc(t.tool_name)}</b><div class="muted">${esc(String(t.description||'').slice(0,160))}</div>${t.status==='changed'?'<div class="status s-failed">Description or inputs changed. It is switched off until you approve it again.</div>':''}</td>
<td><select class="select u-max-width-180px mcpRisk" data-conn="${esc(x.connection_id)}" data-tool="${esc(t.tool_name)}">${riskOpts(t.risk)}</select>${confirmed?'':`<div class="muted">Suggested: ${esc(t.suggested_risk||'no idea')}. Pick one to continue.</div>`}</td>
<td>${approval}</td><td>${act}</td></tr>`;
  };
  const box=(x,i)=>{
    const ts=tools[i].filter(t=>t.status!=='removed'||t.function_id);
    return `<div class="panel"><div class="row wrap"><h3 class="u-margin-bottom-0">${esc(x.name)}</h3><span class="status s-${x.health==='ok'?'ok':x.health==='unknown'||x.discovering?'checking':'failed'}">${x.discovering?'checking…':esc(healthText[x.health]||x.health)}</span><span class="spacer"></span>${x.auth_kind==='oauth'?`<button class="btn small primary mcpSign" data-id="${esc(x.connection_id)}">${x.oauth&&x.oauth.signed_in?'Sign in again':'Sign in'}</button>${x.oauth&&x.oauth.signed_in?`<button class="btn small mcpOut" data-id="${esc(x.connection_id)}">Sign out</button>`:''}`:''}<button class="btn small mcpDisc" data-id="${esc(x.connection_id)}">Check again</button><button class="btn small mcpEdit" data-id="${esc(x.connection_id)}">Edit</button></div>
<div class="muted mono u-margin-bottom-10px">${esc(x.base_url)}</div>${x.auth_kind==='oauth'?`<div class="muted u-margin-bottom-10px">${x.oauth&&x.oauth.signed_in?'Signed in'+(x.oauth.expires_at?' until '+esc(new Date(x.oauth.expires_at).toLocaleString())+'. It renews itself.':'.'):'Not signed in yet.'} <span class="mcpClientRow hidden"><input class="input u-max-width-180px mcpClient" data-id="${esc(x.connection_id)}" placeholder="Client id"> only if the server cannot register one for you.</span></div>`:''}${x.health_detail&&!x.discovering?`<div class="banner">${esc(x.health_detail)}</div>`:''}
<table class="table"><thead><tr><th>Tool</th><th>What can it do?</th><th>Approval</th><th></th></tr></thead><tbody>${ts.map(t=>toolRow(x,t)).join('')||`<tr><td colspan="4" class="muted">${x.discovering?'Looking for tools…':'No tools yet. Check again once the server is reachable.'}</td></tr>`}</tbody></table></div>`;
  };
  $('#view').innerHTML=`<div class="muted u-margin-bottom-10px">Connect a Model Context Protocol server to give agents abilities PostgreSQL cannot provide, such as research, equipment control, or monitoring. The server runs outside PostgreSQL. A local (stdio) server runs behind an HTTP relay, and you paste the relay address here.</div>
<div class="panel"><h3>Connect a server</h3><div class="grid2"><div class="field"><label>Name</label><input class="input" id="mcName" placeholder="e.g. research"></div><div class="field"><label>Address</label><input class="input" id="mcUrl" placeholder="https://example.com/mcp"></div>
<div class="field"><label>Sign-in</label><select class="select" id="mcAuth"><option value="none">None</option><option value="authorization">Key sent as Authorization: Bearer</option><option value="x-api-key">Key sent as x-api-key</option><option value="oauth">Sign in with OAuth</option></select></div><div class="field"><label>Key (if it needs one)</label><input type="password" class="input" id="mcKey" autocomplete="new-password"></div></div>
<div class="muted">With OAuth, leave the key empty and press Sign in on the server after you connect it.</div><label class="muted"><input type="checkbox" id="mcPrivate"> The server is on this machine or a private network</label><div class="row u-margin-top-12px-gap-8px"><button class="btn primary" id="mcGo">Connect and look for tools</button></div></div>
${servers.map(box).join('')||'<div class="panel muted">No MCP servers yet. Connect one above.</div>'}`;
  const v=id=>$('#'+id).value;
  const go=async(action,body,msg)=>{try{await rpc(action,body);if(msg)toast(msg);mcpPage()}catch(e){toast(e.message);mcpPage()}};
  $('#mcGo').onclick=()=>{if(!v('mcName')||!v('mcUrl'))return toast('Give it a name and an address');go('mcp.connect',{name:v('mcName'),base_url:v('mcUrl'),auth_kind:v('mcAuth'),api_key:v('mcKey'),allow_private_network:$('#mcPrivate').checked},'Connecting…')};
  document.querySelectorAll('.mcpSign').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,clientIn=document.querySelector(`.mcpClient[data-id="${id}"]`);
    b.disabled=true;toast('Looking for how this server signs you in…');
    try{
      for(let i=0;i<40;i++){
        const st=await rpc('mcp.oauth_start',{connection_id:id,redirect_base:location.origin,client_id:clientIn?clientIn.value:''});
        if(st.status==='ready'){location.href=st.authorize_url;return}
        if(st.status==='needs_client_id'){clientIn?.closest('.mcpClientRow')?.classList.remove('hidden');toast(st.message);break}
        await new Promise(r=>setTimeout(r,500));
      }
      mcpPage();
    }catch(e){toast(e.message);mcpPage()}
  });
  document.querySelectorAll('.mcpOut').forEach(b=>b.onclick=()=>{if(confirm('Sign out of this server? Agents cannot use its tools until you sign in again.'))go('mcp.oauth_forget',{connection_id:b.dataset.id},'Signed out')});
  document.querySelectorAll('.mcpDisc').forEach(b=>b.onclick=()=>go('mcp.discover',{connection_id:b.dataset.id},'Checking…'));
  document.querySelectorAll('.mcpEdit').forEach(b=>b.onclick=async()=>{const c=((await rpc('connections.list')).connections||[]).find(c=>c.connection_id===b.dataset.id);state.connections=(await rpc('connections.list')).connections||[];if(c)connectionModal(c)});
  document.querySelectorAll('.mcpRisk').forEach(sel=>sel.onchange=()=>{if(sel.value)go('mcp.tool_risk',{connection_id:sel.dataset.conn,tool:sel.dataset.tool,risk:sel.value})});
  document.querySelectorAll('.mcpAppr').forEach(sel=>sel.onchange=()=>{go('mcp.tool_risk',{connection_id:sel.dataset.conn,tool:sel.dataset.tool,risk:'read',approval:sel.value})});
  document.querySelectorAll('.mcpReg').forEach(b=>b.onclick=()=>go('mcp.tool_register',{connection_id:b.dataset.conn,tool:b.dataset.tool},'Registered. Give an agent the ability from the Canvas or Agents page.'));
  if(servers.some(x=>x.discovering||(x.oauth&&x.oauth.busy))&&state.page==='MCP')mcpPollTimer=setTimeout(()=>{if(state.page==='MCP')mcpPage()},1500);
}
// --- Routing (admin): who decides what. Units and roles for people,
// memberships, rules that route an approval or proposal to a role, and
// time-boxed delegation. See docs/approvals-and-roles.md. ---
const opt=(v,label,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(label)}</option>`;
async function routingTab(target,reload){
  const [o,u,c]=await Promise.all([rpc('org.state'),rpc('users.list'),rpc('canvas.state').catch(()=>({groups:[]}))]);
  const users=u.users||[],groups=c.groups||[];
  const roleOpts=(o.roles||[]).map(r=>opt(r.role_id,r.name)).join(''),unitOpts=(o.units||[]).map(x=>opt(x.unit_id,x.name)).join('');
  const userOpts=users.map(x=>opt(x.user_id,x.username)).join('');
  const hrs=sec=>sec==null?'':(sec%3600===0?`${sec/3600} h`:`${Math.round(sec/60)} min`);
  const table=(head,rows,empty)=>`<table class="table"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${head.length}" class="muted">${esc(empty)}</td></tr>`}</tbody></table>`;
  target.innerHTML=`<div class="muted u-font-size-12px-margin-bottom-10px">Without a rule, an approval or proposal is decided as before: by an admin, or by a user assigned to the agent. A rule sends matching requests to a role; the agent's own user can then see the request but not decide it.</div>
<div class="panel"><h3>Rules</h3>${table(['Priority','Applies to','Matches','Decider','Then after','',],(o.rules||[]).map(r=>`<tr><td class="mono">${esc(r.priority)}</td><td>${esc(r.applies_to)}</td><td>${[r.match_kind?'kind '+esc(r.match_kind):'',r.match_group?'group '+esc(r.match_group):''].filter(Boolean).join(', ')||'<span class="muted">everything</span>'}</td><td><b>${esc(r.decider_role)}</b>${r.decider_unit?` <span class="muted">in ${esc(r.decider_unit)}</span>`:''}</td><td>${r.escalate_role?`${esc(hrs(r.escalate_after_seconds))} → <b>${esc(r.escalate_role)}</b>`:'<span class="muted">—</span>'}</td><td><button class="btn danger small rtDelRule" data-id="${esc(r.rule_id)}">Delete</button></td></tr>`),'No rules yet. Without a rule, an admin or the user assigned to the agent decides. Add one below to route requests to a role.')}
<div class="row wrap u-margin-top-12px-gap-8px"><select class="select u-max-width-140px" id="ruApplies"><option value="approval">approvals</option><option value="proposal">proposals</option></select><input class="input u-max-width-200px" id="ruKind" placeholder="kind (optional)" list="ruKinds"><datalist id="ruKinds"><option value="await_human"><option value="execution"><option value="outbound_unknown"><option value="create_function"><option value="update_function"><option value="create_agent"><option value="policy_change"></datalist><select class="select u-max-width-200px" id="ruGroup"><option value="">any agent group</option>${groups.map(g=>opt(g.group_id,g.name)).join('')}</select><select class="select u-max-width-180px" id="ruRole"><option value="">decider role…</option>${roleOpts}</select><select class="select u-max-width-180px" id="ruUnit"><option value="">any unit</option>${unitOpts}</select><input class="input u-max-width-110px" id="ruEscHours" type="number" min="1" placeholder="after hours"><select class="select u-max-width-180px" id="ruEscRole"><option value="">no escalation</option>${roleOpts}</select><input class="input u-max-width-90px" id="ruPriority" type="number" value="100" title="Lower runs first"><button class="btn primary" id="ruAdd">Add rule</button></div></div>
<div class="panel"><h3>Roles</h3>${table(['Role','What it is for',''],(o.roles||[]).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="muted">${esc(r.description)}</td><td><button class="btn danger small rtDelRole" data-id="${esc(r.role_id)}">Delete</button></td></tr>`),'No roles yet. A role names who is responsible for decisions, for example Marketing head.')}<div class="row wrap u-margin-top-12px-gap-8px"><input class="input u-max-width-200px" id="roName" placeholder="role, e.g. Marketing head"><input class="input" id="roDesc" placeholder="what it decides (optional)"><button class="btn" id="roAdd">Add role</button></div><div class="muted u-font-size-12px-margin-top-6px">Deleting a role also deletes the rules that name it. A request already routed to it can then be decided only by an admin.</div></div>
<div class="panel"><h3>Units</h3>${table(['Unit','Under',''],(o.units||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="muted">${esc((o.units.find(y=>y.unit_id===x.parent_unit_id)||{}).name||'')}</td><td><button class="btn danger small rtDelUnit" data-id="${esc(x.unit_id)}">Delete</button></td></tr>`),'No units yet. Units are optional departments or teams that a role can belong to.')}<div class="row wrap u-margin-top-12px-gap-8px"><input class="input u-max-width-200px" id="unName" placeholder="unit, e.g. Marketing"><select class="select u-max-width-200px" id="unParent"><option value="">top level</option>${unitOpts}</select><button class="btn" id="unAdd">Add unit</button></div></div>
<div class="panel"><h3>People</h3>${table(['Person','Role','Unit',''],(o.memberships||[]).map(m=>`<tr><td><b>${esc(m.username)}</b></td><td>${esc(m.role)}</td><td class="muted">${esc(m.unit||'anywhere')}</td><td><button class="btn danger small rtDelMem" data-id="${esc(m.membership_id)}">Remove</button></td></tr>`),'Nobody holds a role yet.')}<div class="row wrap u-margin-top-12px-gap-8px"><select class="select u-max-width-200px" id="meUser"><option value="">person…</option>${userOpts}</select><select class="select u-max-width-200px" id="meRole"><option value="">role…</option>${roleOpts}</select><select class="select u-max-width-200px" id="meUnit"><option value="">anywhere</option>${unitOpts}</select><button class="btn" id="meAdd">Give role</button></div></div>
<div class="panel"><h3>Delegation</h3><div class="muted u-font-size-12px-margin-bottom-10px">While a delegation is active, the second person may decide what the first person's roles decide.</div>${table(['From','To','Until','',''],(o.delegations||[]).map(d=>`<tr><td><b>${esc(d.from)}</b></td><td><b>${esc(d.to)}</b></td><td class="mono u-font-size-12px">${esc(d.valid_until)}</td><td>${d.active?status('running'):status('disabled')}</td><td><button class="btn danger small rtDelDel" data-id="${esc(d.delegation_id)}">Remove</button></td></tr>`),'No delegations.')}<div class="row wrap u-margin-top-12px-gap-8px"><select class="select u-max-width-200px" id="deFrom"><option value="">from…</option>${userOpts}</select><select class="select u-max-width-200px" id="deTo"><option value="">to…</option>${userOpts}</select><input class="input u-max-width-220px" id="deUntil" type="datetime-local" title="Active until"><button class="btn" id="deAdd">Delegate</button></div></div>`;
  const go=async(action,body,msg)=>{try{await rpc(action,body);toast(msg);(reload||peoplePage)()}catch(e){toast(e.message)}};
  const v=id=>$('#'+id).value;
  target.querySelectorAll('.rtDelRule').forEach(b=>b.onclick=()=>go('approval_rules.delete',{rule_id:b.dataset.id},'Rule deleted'));
  target.querySelectorAll('.rtDelRole').forEach(b=>b.onclick=()=>{if(confirm('Delete this role? Rules that name it and everyone who holds it are removed too.'))go('org.roles.delete',{role_id:b.dataset.id},'Role deleted')});
  target.querySelectorAll('.rtDelUnit').forEach(b=>b.onclick=()=>go('org.units.delete',{unit_id:b.dataset.id},'Unit deleted'));
  target.querySelectorAll('.rtDelMem').forEach(b=>b.onclick=()=>go('org.memberships.remove',{membership_id:b.dataset.id},'Role removed'));
  target.querySelectorAll('.rtDelDel').forEach(b=>b.onclick=()=>go('approval_delegations.remove',{delegation_id:b.dataset.id},'Delegation removed'));
  $('#roAdd').onclick=()=>go('org.roles.save',{name:v('roName'),description:v('roDesc')},'Role added');
  $('#unAdd').onclick=()=>go('org.units.save',{name:v('unName'),parent_unit_id:v('unParent')},'Unit added');
  $('#meAdd').onclick=()=>{if(!v('meUser')||!v('meRole'))return toast('Pick a person and a role');go('org.memberships.add',{user_id:v('meUser'),role_id:v('meRole'),unit_id:v('meUnit')},'Role given')};
  $('#deAdd').onclick=()=>{if(!v('deFrom')||!v('deTo')||!v('deUntil'))return toast('Pick two people and an end time');go('approval_delegations.add',{from_user_id:v('deFrom'),to_user_id:v('deTo'),valid_until:new Date(v('deUntil')).toISOString()},'Delegation added')};
  $('#ruAdd').onclick=()=>{
    if(!v('ruRole'))return toast('Pick the role that decides');
    const hours=Number(v('ruEscHours')||0);
    if(!!hours!==!!v('ruEscRole'))return toast('Escalation needs both a time and a role');

  const row=m=>`<tr><td>${esc(m.provider)}</td><td class="mono">${esc(m.model)}</td><td>${m.agents.length?esc(m.agents.join(', ')):'<span class="muted">—</span>'}</td><td class="mono">${m.reported?`${esc(m.reported.input_per_1k)} in / ${esc(m.reported.output_per_1k)} out`:'<span class="muted">not reported</span>'}</td><td>${m.reported?`<button class="btn small useReported" data-provider="${esc(m.provider_id)}" data-model="${esc(m.model)}">Use this price</button>`:`<button class="btn small fillPrice" data-provider="${esc(m.provider_id)}" data-model="${esc(m.model)}">Enter a price</button>`}</td></tr>`;

ed" title="'+esc(c.health_detail||'')+'">key not accepted</span>':c.health==='unreachable'?'<span class="status s-failed" title="'+esc(c.health_detail||'')+'">cannot be reached</span>':'<span class="status s-untested">not tested</span>'}${c.health!=='ok'&&c.health!=='unknown'&&c.health_detail&&!c.testing?`<div class="muted">${esc(c.health_detail)}</div>`:''}</td><td><div class="row"><button class="btn small testConn" data-id="${esc(c.connection_id)}">Test</button><button class="btn small editConn" data-id="${esc(c.connection_id)}">${esc(t('edit'))}</button><button class="btn danger small deleteConn" data-id="${esc(c.connection_id)}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No connections yet. Add one so agents can call an external API with a stored credential.</td></tr>'}</tbody></table><div class="row u-margin-top-12px"><button class="btn primary" id="newConn">Add connection</button></div></div><div class="panel"><h3>Functions</h3><div class="muted u-font-size-12px-margin-bottom-10px">A tool an agent can call. It is the callable half of a Procedure (see docs/procedures.md): a fixed <code>http_get</code> URL, a real role-scoped PL/pgSQL <code>plpgsql</code> body, or one remote <code>mcp_call</code> tool on an API connection above. Bind one to a Procedure so a granted agent sees it alongside that Procedure's content.</div><table class="table"><thead><tr><th>Name</th><th>Handler</th><th>Build</th><th>Bound to</th><th>Status</th><th></th></tr></thead><tbody>${state.functions.map(f=>`<tr><td><b>${esc(f.name)}</b><div class="muted u-font-size-11px">${esc(f.description)}</div></td><td class="mono">${esc(f.handler)}</td><td>${f.handler==='plpgsql'?(f.build_status==='built'?status('running'):f.build_status==='failed'?status('failed'):status('waiting_human')):'—'}</td><td class="u-font-size-12px">${(f.procedures||[]).join(', ')||'—'}</td><td>${f.is_active?status('running'):status('disabled')}</td><td><button class="btn small editFunc" data-id="${esc(f.function_id)}">${esc(t('edit'))}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No functions yet. Use + Create at the top to give agents a new tool.</td></tr>'}</tbody></table></div><div class="panel"><h3>Procedures</h3><div class="muted u-font-size-12px-margin-bottom-10px">A named, versioned, reusable "how to do X" an agent can be granted (permission type <code>procedure</code>) -- its current content is shown in every granted agent's prompt on every turn, alongside its own memory. Editing one keeps its full history; Rollback creates a new version rather than rewriting an old one. A <code>body</code> (below) makes it real, runnable code a granted agent can trigger with <code>run_procedure</code> instead of only reading <code>content</code> as guidance.</div><table class="table"><thead><tr><th>Name</th><th>Content</th><th>Body</th><th>Version</th><th>Status</th><th></th></tr></thead><tbody>${state.procedures.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="u-max-width-320px-white-space-pre-wrap">${esc(p.content)}</td><td>${p.body?(p.build_status==='built'?status('running'):p.build_status==='failed'?status('failed'):status('waiting_human')):'<span class="muted">none</span>'}</td><td class="mono">v${esc(p.generation)}</td><td>${p.is_active?status('running'):status('disabled')}</td><td><button class="btn small editProc" data-id="${esc(p.procedure_id)}">${esc(t('edit'))}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No procedures yet. Use + Create at the top to teach agents a how-to.</td></tr>'}</tbody></table></div><div class="panel"><h3>Function model experiments</h3><div class="muted u-font-size-12px-margin-bottom-10px">Canary experiments self_improve runs to find a cheaper model for one function (see <code>functions.llm_override</code> and <code>model_experiments</code>). Success rate is a format-validity signal -- did the reply parse into a valid action -- not a judgment of whether the answer was actually correct.</div><table class="table"><thead><tr><th>Function</th><th>Candidate</th><th>Canary</th><th>Status</th><th>Sample</th><th>Success rate</th><th>Baseline</th><th>Created</th></tr></thead><tbody>${state.functionExperiments.map(x=>`<tr><td><b>${esc(x.function_name)}</b></td><td class="mono">${esc(x.candidate_provider)} / ${esc(x.candidate_model)}</td><td class="mono">${esc(x.canary_percent)}%</td><td>${status(x.status)}</td><td class="mono">${esc(x.success_count??0)} / ${esc(x.sample_size??0)}<div class="muted u-font-size-11px">min ${esc(x.min_sample_size)}</div></td><td class="mono">${x.candidate_success_rate??'—'}</td><td class="mono">${x.baseline_success_rate??'—'}</td><td class="mono muted u-font-size-11px">${esc(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No experiments yet.</td></tr>'}</tbody></table>${selfImprove?`<div class="row wrap u-margin-top-14px-border-top-1px-solid-var-line-padding-top-12px-align-items-flex-end"><div><div class="label">self_improve function_override dials</div><div class="mono u-font-size-12px">self_approve cap ${esc(selfImprove.agent_config?.function_override_self_approve_canary_cap??20)}% · auto promote slack ${esc(selfImprove.agent_config?.function_override_auto_promote_slack_pct??0)}pp</div></div><span class="spacer"></span><div class="field u-margin-0-min-width-220px"><label>Apply a preset</label><select class="select" id="teePreset"><option value="conservative">conservative (cap 10%, slack 0)</option><option value="balanced">balanced (cap 20%, slack 0)</option><option value="aggressive">aggressive (cap 50%, slack 5)</option></select></div><button class="btn primary" id="teApplyPreset">Apply</button></div><div class="muted u-font-size-11px-margin-top-6px">Governs how much of self_improve's own <code>function_override</code> proposing/deciding happens automatically vs. queued for an admin, at each <code>autonomy_level</code> tier -- edit self_improve in Agents for autonomy_level itself, or call <code> ct u-max-width-260px" id="uiLangSel" aria-label="Language"><option value="en">English</option></select></div><div class="muted u-font-size-12px u-margin-top-8px" id="uiLangNote"></div></div><div class="panel"><h3>${esc(t('theme'))}</h3><div class="row wrap"><span class="muted u-min-width-90px">${esc(t('theme'))}</span><button class="btn small themeBtn${(theme()||'dark')==='dark'?' primary':''}" data-theme="dark">${esc(t('dark'))}</button><button class="btn small themeBtn${theme()==='light'?' primary':''}" data-theme="light">${esc(t('light'))}</button></div></div>`;

// The admin SQL console (dashboard_rpc action sql.execute, allgres_public.
// fn_admin_execute_sql's own comment covers what it runs as and why) --
// no query history/tabs/multi-statement support, on purpose: this exists
// so an admin never has to open a separate client for one query, not to
// replace one. Ctrl/Cmd+Enter runs the query, the same shortcut every
// real SQL client uses.
async function sqlConsolePage(){
  $('#view').innerHTML=`<div class="panel"><h3>SQL console</h3><div class="muted u-font-size-12px-margin-bottom-10px">Runs as <code>allgres_owner</code> -- the role that owns essentially all of allgres's own schemas and functions, not a read-only sandbox. One statement per run (Ctrl/Cmd+Enter). Every query reaches the audit log before it runs, whether it succeeds or not.</div><textarea class="textarea mono u-min-height-140px" id="sqlInput" placeholder="SELECT * FROM allgres_public.v_agent_health"></textarea><div class="row u-margin-top-12px"><button class="btn primary" id="sqlRun">Run</button><span class="spacer"></span><span class="muted mono u-font-size-12px" id="sqlMeta"></span></div></div><div id="sqlResultPanel"></div>`;
  const run=async()=>{
    const sql=$('#sqlInput').value.trim();
    if(!sql)return;
    $('#sqlRun').disabled=true;$('#sqlMeta').textContent='running…';
    const t0=performance.now();
    try{
      const r=await rpc('sql.execute',{sql});
      $('#sqlMeta').textContent=`${(performance.now()-t0).toFixed(0)} ms`;
      renderSqlResult(r);
    }catch(e){
      $('#sqlMeta').textContent='';
      renderSqlResult(null,e.message);
    }finally{
      $('#sqlRun').disabled=false;
    }
  };
  $('#sqlRun').onclick=run;
  $('#sqlInput').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}};
}
function renderSqlResult(r,errMsg){
  const panel=$('#sqlResultPanel');
  if(errMsg){panel.innerHTML=`<div class="banner">${esc(errMsg)}</div>`;return}
  // fn_admin_execute_sql's own shape for a statement with no output rows
  // (DDL, or DML with no RETURNING) -- a count, not a real row set.
  if('rows_affected' in r){
    panel.innerHTML=`<div class="panel">ok -- ${esc(r.rows_affected)} row(s) affected.</div>`;return;
  }
  const cols=r.cols||[],rows=r.rows||[];
  if(!rows.length){panel.innerHTML=`<div class="panel muted">No rows.</div>`;return}
  // cols/rows, not one keyed object per row: jsonb sorts object keys as
  // part of its own storage, so a keyed shape came back alphabetized
  // instead of in SELECT order (confirmed live) -- see
  // fn_admin_execute_sql's own comment for why this positional shape is
  // what actually survives being embedded in dashboard_rpc's own jsonb
  // response.
  panel.innerHTML=`<div class="panel"><div class="muted u-font-size-12px-margin-bottom-10px">${esc(rows.length)} row(s)</div><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td class="mono">${esc(fmtSqlCell(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function fmtSqlCell(v){
  if(v===null||v===undefined)return '—';
  if(typeof v==='object')return JSON.stringify(v);
  return String(v);
}
function providerModal(p){
  const isOauth=p.kind==='oauth';
  // xai_oauth is seeded with oauth_flow='device_code' (RFC 8628); every other
  // oauth provider uses the ordinary authorization-code redirect below.
  // fn_oauth_start itself rejects a device_code provider outright ("provider
  // uses device-code oauth"), so this branch is not optional polish -- without
  // it, clicking Connect on a device-code provider always fails.
  const isDeviceFlow=isOauth&&p.oauth_flow==='device_code';
  const isEmbedding=p.purpose==='embedding';
  const oauthFields=isOauth?`<div class="field"><label>Authorization URL</label><input class="input" id="pAuthUrl" value="${esc(p.oauth_auth_url||'')}" ${isDeviceFlow?'disabled':''}></div><div class="field"><label>Token URL</label><input class="input" id="pTokenUrl" value="${esc(p.oauth_token_url||'')}"></div><div class="field"><label>Client ID</label><input class="input" id="pClientId" value="${esc(p.oauth_client_id||'')}"></div><div class="field"><label>Client secret (leave blank to keep existing)</label><input type="password" class="input" id="pClientSecret" autocomplete="new-password"></div>`:'';
  // Authorization-code providers redirect back to whatever URL is registered
  // with the provider's own OAuth app -- that has to be this dashboard's own
  // URL exactly, and there was previously no way to see that value without
  // reading the source. Device-code providers never redirect anywhere, so no
  // URI to register exists for them.
  const redirectUri=location.origin+location.pathname;
  const connectRow=isOauth?(isDeviceFlow
    ?`<div class="row u-margin-14px-0-flex-direction-column-align-items-stretch-gap-8px"><div class="row"><button class="btn" id="connectOauth">Connect via OAuth</button><span class="spacer"></span><span class="muted u-font-size-12px">${p.has_secret?'A token is stored for this provider.':'Not connected yet.'}</span></div><div class="muted u-font-size-12px">Device login: click Connect, then open the link that appears on any device (this one or your phone) and enter the code shown. This tab keeps checking automatically -- no redirect happens.</div><div id="deviceFlowOut" class="mono u-font-size-13px"></div></div>`
    :`<div class="row u-margin-14px-0"><button class="btn" id="connectOauth">Connect via OAuth</button><span class="spacer"></span><span class="muted u-font-size-12px">${p.has_secret?'A token is stored for this provider.':'Not connected yet.'}</span></div><div class="muted u-font-size-12px">Register this exact redirect URI with the provider's OAuth app before connecting: <span class="mono">${esc(redirectUri)}</span></div>`
  ):'';
  const embedField=isEmbedding?`<div class="field"><label>Embedding model</label><input class="input" id="pEmbedModel" value="${esc(p.embedding_model||'')}"></div>`:'';
  const jsonModeField=isOauth?'':`<div class="field"><label><input type="checkbox" id="pJsonMode" ${p.response_format_json_object!==false?'checked':''}> Send OpenAI response_format</label><div class="muted u-font-size-12px">Most servers accept it and it improves reply quality. Uncheck for a local server that rejects it outright (confirmed live against LM Studio: HTTP 400, "response_format.type must be 'json_schema' or 'text'"); already off for the seeded Ollama provider.</div></div>`;
  // GET {base_url}/models, queued by fn_provider_probe_start and run by the
  // same runtime worker HTTP pool as everything else here -- confirms the
  // stored credential actually works (Status column on the list, above)
  // and fills available_models, which every Model field's datalist reads
  // from. Available for every provider, not just oauth -- an API-key
  // provider needs this exactly as much (a typo'd key still "saves" fine).
  const probeLine=(p.last_probe_status==='ok'
    ?`Last check: connected${p.last_probe_at?` (${esc(p.last_probe_at)})`:''}${(p.available_models||[]).length?`, ${p.available_models.length} model(s) found`:''}.`
    :p.last_probe_status==='error'
    ?`Last check failed: ${esc(p.last_probe_error||'unknown error')}`
    :'Not tested yet.')
    +(p.last_chat_status==='ok'?` Chat worked with ${esc(p.last_chat_model||'a model')}.`
      :p.last_chat_status==='error'?` Chat failed with ${esc(p.last_chat_model||'a model')}: ${esc(p.last_chat_error||'')}`:'');
  const probeRow=isOauth?`<div class="row u-margin-14px-0"><button class="btn" id="testConn">Save &amp; test connection</button><span class="spacer"></span><span id="probeOut" class="muted u-font-size-12px">${probeLine}</span></div>`
    :`<div class="field"><label>Model to test with <span class="muted">-- optional; tests a real chat message too</span></label><input class="input" id="pTestModel" list="pTestModels" value="${esc(p.last_chat_model||(p.available_models||[])[0]||'')}" placeholder="e.g. gpt-4o, llama3">${modelDatalist('pTestModels',p.available_models||[])}</div><div class="row u-margin-14px-0"><button class="btn" id="testDraft">Test connection</button><button class="btn" id="testConn">Save &amp; test</button></div><div id="probeOut" class="muted u-font-size-12px">${probeLine}</div>`;
  $('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(p.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Purpose</label><div class="muted u-font-size-12px">${isEmbedding?'embedding -- powers search_agents only':'chat -- serves an agent\'s own turns'} (set at creation, cannot be changed here)</div></div>${embedField}<div class="field"><label>Base URL</label><input class="input" id="pUrl" value="${esc(p.base_url)}"></div>${isOauth?'':'<div class="field"><label>API key (leave blank to keep existing)</label><input type="password" class="input" id="pKey" autocomplete="new-password"></div>'}${oauthFields}<div class="field"><label><input type="checkbox" id="pEnabled" ${p.is_enabled?'checked':''}> Enabled</label></div><div class="field"><label><input type="checkbox" id="pPrivate" ${p.allow_private_network?'checked':''}> Allow loopback / private-network endpoint</label><div class="muted u-font-size-12px">Needed for a local Ollama or an in-cluster gateway. Leaving this off is what stops this endpoint from being pointed at an internal address.</div></div>${jsonModeField}${probeRow}${connectRow}<button class="btn primary" id="saveP">Save</button></div>`;
  $('#closeM').onclick=closeModal;
  const saveProvider=()=>{const body={provider_id:p.provider_id,base_url:$('#pUrl').value,is_enabled:$('#pEnabled').checked,allow_private_network:$('#pPrivate').checked,operator_name:opName(),session_token:sessTok()};if(!isOauth)body.response_format_json_object=$('#pJsonMode').checked;if(isOauth){body.oauth_auth_url=$('#pAuthUrl').value;body.oauth_token_url=$('#pTokenUrl').value;body.oauth_client_id=$('#pClientId').value;body.oauth_client_secret=$('#pClientSecret').value}else{body.api_key=$('#pKey').value}if(isEmbedding)body.embedding_model=$('#pEmbedModel').value;return api('/api/v1/settings/provider',{method:'POST',body:JSON.stringify(body)})};
  // Test connection: the form's own values, nothing saved. Save & test: save, then test the saved provider.
  const formValues=()=>({kind:p.kind,base_url:$('#pUrl').value,api_key:$('#pKey')?$('#pKey').value:'',allow_private_network:$('#pPrivate').checked,
    response_format_json_object:$('#pJsonMode')?$('#pJsonMode').checked:true,provider_id:p.provider_id});
  const modelOptions=list=>{if($('#pTestModels'))$('#pTestModels').innerHTML=list.map(m=>`<option value="${esc(m)}">`).join('');if($('#pTestModel')&&!$('#pTestModel').value&&list.length)$('#pTestModel').value=list[0]};
  if($('#testDraft'))$('#testDraft').onclick=()=>runProviderChecks({
    out:$('#probeOut'),model:$('#pTestModel').value.trim(),baseInput:$('#pUrl'),onModels:modelOptions,
    start:(probe,model)=>rpc('providers.draft_probe_start',{...formValues(),probe,model})});
  $('#testConn').onclick=async()=>{
    const out=$('#probeOut');
    out.textContent='Saving…';
    try{
      await saveProvider();
      await runProviderChecks({out,model:$('#pTestModel')?$('#pTestModel').value.trim():'',baseInput:$('#pUrl'),onModels:modelOptions,
        start:(probe,model)=>rpc('providers.probe_start',{provider_id:p.provider_id,probe,model})});
      loadPage();
    }catch(e){out.textContent=e.message}
  };
  $('#saveP').onclick=async()=>{try{await saveProvider();closeModal();toast('Provider saved');loadPage()}catch(e){toast(e.message)}};
  if(isDeviceFlow){
    // Device-code flow (RFC 8628): oauth_device_start only queues the
    // provider's own device-authorization request -- the runtime worker's
    // HTTP pool performs it and fn_complete_oauth fills in user_code/
    // verification_uri, so the first oauth_device_status call or two can
    // still show 'starting' before those fields exist. Poll every 2-3s
    // (well under the provider's own minimum interval) until the session
    // reaches a terminal or user-actionable state.
    $('#connectOauth').onclick=async()=>{
      const out=$('#deviceFlowOut');
      out.textContent='Starting…';
      try{
        await saveProvider();
        const start=await rpc('providers.oauth_device_start',{provider_id:p.provider_id});
        const sessionId=start.session_id;
        const poll=async()=>{
          let s;
          try{s=await rpc('providers.oauth_device_status',{session_id:sessionId})}
          catch(e){out.textContent=e.message;return}
          if(s.status==='awaiting_user'){
            const link=s.verification_uri_complete||s.verification_uri;
            out.innerHTML=`Open <a href="${esc(link)}" target="_blank" rel="noopener">${esc(s.verification_uri)}</a> and enter code <b>${esc(s.user_code)}</b>`;
            setTimeout(poll,3000);
          }else if(s.status==='connected'){
            out.textContent='Connected.';toast('Provider connected');loadPage();
          }else if(s.status==='denied'||s.status==='expired'||s.status==='error'){
            out.textContent='Failed: '+(s.error||s.status);
          }else{
            setTimeout(poll,2000);
          }
        };
        poll();
      }catch(e){out.textContent=e.message}
    };
  }else if(isOauth){
    // Full-page redirect to the provider's own login page, same as any other
    // OAuth "Connect" button -- the provider redirects back to this same
    // dashboard URL with ?code=&state=, which the boot-time handler below
    // (oauthCallbackOnLoad) picks up and completes via providers.oauth_callback.
    $('#connectOauth').onclick=async()=>{try{await saveProvider();const redirect=location.origin+location.pathname;const r=await rpc('providers.oauth_start',{provider_id:p.provider_id,redirect});if(r.redirect_url)location.href=r.redirect_url}catch(e){toast(e.message)}};
  }
}

l Ollama or an in-cluster gateway. Leaving this off blocks internal addresses.</div></div><div class="field" id="npJsonModeField"><label><input type="checkbox" id="npJsonMode" checked> Send OpenAI response_format</label></div><div id="npTestBlock"><div class="field"><label>Model to test with <span class="muted">-- optional; tests a real chat message too</span></label><input class="input" id="npTestModel" list="npTestModels" placeholder="e.g. gpt-4o, llama3"><datalist id="npTestModels"></datalist></div><div class="row u-margin-14px-0"><button class="btn" id="testNew">Test connection</button><span class="muted u-font-size-12px">Nothing is saved by testing.</span></div><div id="npProbeOut" class="muted u-font-size-12px u-margin-bottom-14px"></div></div><button class="btn primary u-margin-top-12px" id="saveNewP">Add provider</button></div>`;

// --- Procedures (roadmap item 4): a named, versioned, reusable "how to do
// X" any agent granted a 'procedure' permission for the same name sees in
// its own prompt every turn (fn_next_step's own '# procedures' block) --
// see that table's own comment in control_plane.sql. Editing shows the
// full version history and a Rollback button per past version, the same
// idea as an agent's own policy History modal. ---
async function procedureModal(p){
  const buildLine=p.body?`<div class="muted u-font-size-12px-margin-bottom-10px">Build: ${esc(p.build_status||'—')}${p.build_error?' -- '+esc(p.build_error):''}</div>`:'';
  $('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(p.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Content <span class="muted">-- shown as guidance in every granted agent's prompt</span></label><textarea class="textarea u-min-height-100px" id="pcContent">${esc(p.content)}</textarea></div><div class="field"><label>Body <span class="muted">-- optional; real PL/pgSQL a granted agent can run with run_procedure, assigning p_result before it ends. Leave blank to keep content-only.</span></label><textarea class="textarea mono u-min-height-140px" id="pcBody" placeholder="BEGIN
  p_result := jsonb_build_object('ok', true);
END;">${esc(p.body||'')}</textarea></div>${buildLine}<div class="field"><label><input type="checkbox" id="pcEnabled" ${p.is_active?'checked':''}> Enabled</label></div><button class="btn primary" id="savePc">Save</button><div class="muted u-font-size-12px-margin-14px-0-6px">Version history (current: v${esc(p.generation)})</div><div id="pcHistory" class="muted">Loading…</div></div>`;
  $('#closeM').onclick=closeModal;
  $('#savePc').onclick=async()=>{try{await rpc('procedures.update',{procedure_id:p.procedure_id,content:$('#pcContent').value,is_active:$('#pcEnabled').checked,body:$('#pcBody').value.trim()||null});closeModal();toast('Saved');loadPage()}catch(e){toast(e.message)}};
  try{
    const d=await rpc('procedures.get',{procedure_id:p.procedure_id});
    $('#pcHistory').innerHTML=(d.history||[]).map(h=>`<div class="row u-padding-4px-0-align-items-flex-start"><div class="mono muted u-font-size-11px-min-width-110px">v${esc(h.generation)} · ${esc(h.changed_at)}</div><div class="u-flex-1-white-space-pre-wrap-font-size-12px">${esc(h.content)}</div><button class="btn small rollbackPc" data-gen="${esc(h.generation)}">Rollback</button></div>`).join('')||'<div class="muted u-font-size-12px">No earlier versions.</div>';
    document.querySelectorAll('.rollbackPc').forEach(b=>b.onclick=async()=>{if(!confirm(`Roll back to v${b.dataset.gen}? This creates a new version with that content, it does not erase what happened since.`))return;try{await rpc('procedures.rollback',{procedure_id:p.procedure_id,generation:b.dataset.gen});closeModal();toast('Rolled back');loadPage()}catch(e){toast(e.message)}});
  }catch(e){$('#pcHistory').textContent=e.message}
}
// --- Functions: the callable half of a Procedure (see docs/procedures.md).
// Three handlers, fixed at creation except plpgsql's own body/param_schema:
// http_get (one URL), plpgsql (a real role-scoped PL/pgSQL body), mcp_call
// (one remote tool on an API connection above). fn_update_function itself
// refuses anything but a plpgsql function ("http_get is fixed at
// creation"), so the edit modal only ever shows Save for that handler --
// everything else is read-only past creation, same restriction the
// backend already enforces, not a UI-only one. ---
function functionHandlerFields(handler){
  if(handler==='mcp_call')return `<div class="grid2"><div class="field"><label>MCP connection</label><select class="select" id="nfConn">${state.connections.map(c=>`<option value="${esc(c.connection_id)}">${esc(c.name)}</option>`).join('')||'<option value="">No connections yet -- add one in API connections above</option>'}</select></div><div class="field"><label>Remote tool name</label><input class="input" id="nfTool" placeholder="e.g. search"></div></div>`;
  if(handler==='plpgsql')return `<div class="field"><label>Body <span class="muted">-- statements only (not a full CREATE FUNCTION); read p_args jsonb, RETURN a jsonb value; runs later as the calling agent's own role</span></label><textarea class="textarea mono u-min-height-140px" id="nfBody" placeholder="BEGIN
  RETURN jsonb_build_object('ok', true);
END;"></textarea></div><div class="field"><label>Param schema (JSON, shown to callers, never enforced)</label><textarea class="textarea mono u-min-height-60px" id="nfParamSchema" placeholder="{}"></textarea></div>`;

span><button class="btn danger" id="deleteSched">Delete</button></div></div>`;
  $('#closeM').onclick=closeModal;
  $('#saveSched').onclick=async()=>{
    try{
      const body={schedule_id:s.schedule_id,goal:$('#scGoal').value,interval_seconds:$('#scInterval').value,is_active:$('#scEnabled').checked};
      const maxRuns=$('#scMaxRuns').value.trim();
      if(maxRuns)body.max_runs=maxRuns;else body.clear_max_runs=true;

}

// General is a direct, continuing conversation with the seeded 'general'
// agent. Team messages are a separate, mention-routed surface.
let generalChatPollTimer=null;
let generalChatAgentId=null;
async function generalChatMode(target){
  const [mine,available]=await Promise.all([
    rpc('agents.mine'),rpc('providers.available').catch(()=>({providers:[]}))
  ]);
  const agent=(mine.agents||[]).find(a=>a.name==='general');
  generalChatAgentId=agent?.agent_id||null;
  if(!agent){target.innerHTML='<div class="panel">The General agent is not assigned to your account. Ask an administrator to assign it.</div>';return}
  const ready=Boolean(agent.provider&&agent.model);
  target.innerHTML=`<div class="panel"><p class="muted">Talk directly with General. To call several agents with <code>@agent-name</code>, use Team messages.</p>${chatModelPicker(agent,available.providers||[])}${ready?'':'<div class="banner">Choose a provider and model above, then save before sending a message.</div>'}<div class="row"><span class="spacer"></span><button class="btn small" id="generalChatNew" title="Start a fresh conversation. The earlier one stays under Activity.">New chat</button></div><div id="generalChatThread" class="chat-thread"></div><div class="row"><input class="input" id="generalChatInput" placeholder="Message General…" ${ready?'':'disabled'}><button class="btn primary" id="generalChatSend" ${ready?'':'disabled'}>${esc(t('send'))}</button></div></div>`;
  wireChatModelPicker(agent,available.providers||[],()=>generalChatMode(target));
  $('#generalChatSend').onclick=sendGeneralChat;
  $('#generalChatNew').onclick=async()=>{if(!confirm('Start a new chat? The earlier one stays under Activity.'))return;try{await rpc('chat.new',{agent_id:generalChatAgentId});toast('New chat');await renderGeneralChatThread()}catch(e){toast(e.message)}};
  $('#generalChatInput').onkeydown=e=>{if(e.key==='Enter')sendGeneralChat()};
  await renderGeneralChatThread();
}
async function renderGeneralChatThread(){
  if(!generalChatAgentId||!$('#generalChatThread'))return;
  try{
    const h=await rpc('chat.history',{agent_id:generalChatAgentId});
    if(!$('#generalChatThread'))return;
    $('#generalChatThread').innerHTML=(h.messages||[]).map(msgBubble).join('')||'<div class="muted">Say hello to General.</div>';
    scrollBottom('#generalChatThread');
  }catch(e){if($('#generalChatThread'))$('#generalChatThread').textContent=e.message}
}
async function sendGeneralChat(){
  const v=$('#generalChatInput')?.value.trim();if(!v||!generalChatAgentId)return;
  $('#generalChatInput').value='';
  try{
    await rpc('chat.send',{agent_id:generalChatAgentId,message:v});
    await renderGeneralChatThread();
    if(generalChatPollTimer)clearInterval(generalChatPollTimer);
    generalChatPollTimer=setInterval(renderGeneralChatThread,3000);
  }catch(e){toast(e.message)}
}
